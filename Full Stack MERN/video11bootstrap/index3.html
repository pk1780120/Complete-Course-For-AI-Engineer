<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bootstrap css</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Form Demo</h2>
        <form>
            <div class="row col">
                <div class="mb-3 col-md-6">
                    <label class="form-label" for="Email">Email</label>
                    <input type="Email" class="form-control" placeholder="Email" id="Email" />
                </div>
                <div action="mb-3 col-md-6">
                    <label class="form-label" for="Password">Password</label>
                    <input type="Password" class="form-control" placeholder="Password" id="Password">
                </div>
            </div>
            <div action="mb-3">
                <label class="form-label" for="Address">Address</label>
                <input type="text" class="form-control-sm" placeholder="Address" id="Address">
            </div>
            <div action="mb-3">
                <select name="form-select">
                    <option selected> select menu our city</option>
                    <option value="1">bhopal</option>
                    <option value="2">indore</option>
                    <option value="3">bhojpur</option>
                </select>
            </div>
            <div class="normal mb-3">
                <input type="checkbox" id="agree">
                <label for="agree">Agree</label>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="agreebs">
                <label for="agreebs" class="form-check-label">Agree</label>
            </div>
            <div class="form-check mb-3">
                <input type="radio" class="form-check-input" id="radiobs">
                <label for="radiobs" class="form-check-label">yes/no</label>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckDefault"/>
                <label class="form-check-label"   for="flexSwitchCheckDefault">Default the switch checkbox input</label>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
