<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lists in html</title>
</head>
<body>
    <h1>My Shopping List</h1>
    <ul>
        <li>bread</li>
        <li>milk</li>
        <li>eggs</li>
        <li>butter</li>
    </ul>
    <ol type="a">
        <li>Go to the store</li>
        <li>Buy groceries</li>
        <li>Return home</li>
        <li>Put away groceries</li>
    </ol>
</body>
</html>
